[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "forge"
version = "0.1.0"
description = "Forge - CLI dev project analyzer"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0",
]

[project.scripts]
devanalyze = "main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["analyzers*", "ui*", "utils*"]

[tool.setuptools]
py-modules = ["main"]
